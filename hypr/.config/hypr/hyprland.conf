# Quattro config — user overrides are in hypr/*.lua files.
# This file only contains raw config that can't be expressed in Lua.

# VNC submap (Lua API doesn't support submaps)
source = ~/.config/hypr/vnc-submap.conf

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, default
}

# NVIDIA environment variables
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

exec-once = dbus-run-session wayvnc 0.0.0.0

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
